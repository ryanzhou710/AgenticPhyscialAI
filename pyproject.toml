[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfd-agent"
version = "0.1.0"
description = "LangGraph orchestration for SpaceClaim and Fluent Meshing"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {file = "LICENSE"}
dependencies = [
  "ansys-fluent-core==0.37.2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
cfd-agent = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.adapters", "src.nodes", "src.prompts", "src.services", "src.workers"]

[tool.setuptools.package-data]
src = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".wheel-venv/",
  "examples/",
  "src/workers/spaceclaim*_v241.py",
  "tests/integration/native_*_fixture_v241.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
